<?xml version="1.0" encoding="UTF-8"?>
<svg id="wf" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="10 10 940 998">
  <style>
    #wf text { font-family: 'Avenir Next', Avenir, 'Segoe UI', Helvetica, Arial, sans-serif }
    #wf .lane { fill: rgba(0,0,0,.31); stroke: none; stroke-width: 1px }
    #wf .box { fill: #294345; stroke: #5fd4c0; stroke-width: 1.5px }
    #wf .box-claude { fill: #463d2f; stroke: #f0b452; stroke-width: 1.5px }
    #wf .box-sol { fill: #2e3950; stroke: #7aa2f7; stroke-width: 1.5px }
    #wf .box-ready { fill: #354f41; stroke: #7fd98f; stroke-width: 3px }
    #wf .h { font-size: 13px; font-weight: 700; fill: #e7e9ee; text-anchor: middle }
    #wf .i { font-size: 11px; fill: #d0d5dd; text-anchor: middle }
    #wf .note { font-size: 10px; fill: #f0b452 }
    #wf .edge { font-size: 10px; fill: #99a1ad }
    #wf .failt { font-size: 10px; fill: #f07178 }
    #wf .lane-h { font-size: 12px; font-weight: 700; letter-spacing: .15em; text-anchor: middle }
    #wf .flow { fill: none; stroke: #6fc7b8; stroke-width: 1.5px; marker-end: url(#wf-m-flow) }
    #wf .gold { fill: none; stroke: #f0b452; stroke-width: 1.3px; stroke-dasharray: 4 3; marker-end: url(#wf-m-gold) }
    #wf .fail { fill: none; stroke: #f07178; stroke-width: 1.5px; stroke-dasharray: 6 4; marker-end: url(#wf-m-fail) }
  </style>
  <defs>
    <marker id="wf-m-flow" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0L8,3L0,6z" fill="#6fc7b8"/></marker>
    <marker id="wf-m-gold" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0L8,3L0,6z" fill="#f0b452"/></marker>
    <marker id="wf-m-fail" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0L8,3L0,6z" fill="#f07178"/></marker>
  </defs>

    <rect class="lane" x="10" y="10" width="300" height="998" rx="10"/>
    <rect class="lane" x="330" y="10" width="300" height="998" rx="10"/>
    <rect class="lane" x="650" y="10" width="300" height="998" rx="10"/>
    <text class="lane-h" x="160" y="38" fill="#f0b452">CLAUDE</text>
    <text class="lane-h" x="480" y="38" fill="#5fd4c0">ORCHESTRATOR</text>
    <text class="i" x="480" y="54">writes no code</text>
    <text class="lane-h" x="800" y="38" fill="#7aa2f7">CODEX</text>

    <rect x="350" y="70" width="260" height="54" rx="8" fill="none" stroke="#5fd4c0" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text class="h" x="480" y="93">Design or intent</text>
    <text class="i" x="480" y="111">one goal split into PR-sized slices</text>
    <path class="flow" d="M480,124V154"/>
    <text class="edge" x="488" y="143">next slice, or an issue</text>
    <rect class="box" x="350" y="154" width="260" height="54" rx="8"/>
    <text class="h" x="480" y="177">Read and reproduce</text>
    <text class="i" x="480" y="195">check it’s still needed and unclaimed</text>
    <path class="flow" d="M480,208V234"/>

    <rect class="box-claude" x="30" y="234" width="260" height="54" rx="8"/>
    <text class="h" x="160" y="257">Opus plans alone</text>
    <text class="i" x="160" y="275">from the issue and the code</text>
    <rect class="box" x="350" y="234" width="260" height="54" rx="8"/>
    <text class="h" x="480" y="257">Merge</text>
    <text class="i" x="480" y="275">smallest correct plan</text>
    <rect class="box-sol" x="670" y="234" width="260" height="54" rx="8"/>
    <text class="h" x="800" y="257">Sol plans alone</text>
    <text class="i" x="800" y="275">from the issue and the code</text>
    <path class="flow" d="M290,261H350"/><path class="flow" d="M670,261H610"/>
    <path class="flow" d="M480,288V314"/>

    <rect class="box-claude" x="30" y="314" width="260" height="54" rx="8"/>
    <text class="h" x="160" y="337">Opus re-derives it</text>
    <text class="i" x="160" y="355">from scratch, then diffs the merge</text>
    <rect class="box" x="350" y="314" width="260" height="54" rx="8"/>
    <text class="h" x="480" y="337">Fix the plan</text>
    <text class="i" x="480" y="355">wherever the two differ</text>
    <path class="flow" d="M290,341H350"/><path class="flow" d="M610,341H800V380"/>
    <rect class="box-sol" x="670" y="380" width="260" height="54" rx="8"/>
    <text class="h" x="800" y="403">Sol codes</text>
    <text class="i" x="800" y="421">in its own worktree</text>

    <rect class="box-claude" x="30" y="484" width="260" height="54" rx="8"/>
    <text class="h" x="160" y="507">Claude reviews</text>
    <text class="i" x="160" y="525">no plan; round 1 also checks the issue</text>
    <rect class="box" x="350" y="484" width="260" height="54" rx="8"/>
    <text class="h" x="480" y="507">Judge findings</text>
    <text class="i" x="480" y="525">a rejection needs the other model</text>
    <rect class="box-sol" x="670" y="484" width="260" height="54" rx="8"/>
    <text class="h" x="800" y="507">Sol reviews</text>
    <text class="i" x="800" y="525">fresh each round, no plan</text>
    <path class="flow" d="M290,511H350"/><path class="flow" d="M670,511H610"/>
    <path class="flow" d="M590,484V450H760V434"/>
    <text class="edge" x="760" y="464" text-anchor="middle">fix findings</text>
    <path class="gold" d="M350,496H320V348" style="marker-end:none"/><path class="gold" d="M320,334V276H350"/>
    <text class="note" x="338" y="403" font-weight="700">back to planning when</text>
    <text class="note" x="338" y="417">· the same part needs a second fix</text>
    <text class="note" x="338" y="430">· a fix needs a part the plan lacks</text>
    <text class="note" x="338" y="443">· 3 rounds without fewer serious findings</text>
    <text class="note" x="338" y="456">· a reviewer calls for a redesign</text>

    <path class="flow" d="M480,538V564"/>
    <rect x="180" y="564" width="600" height="170" rx="8" fill="#1b1f26" stroke="#f0b452" stroke-opacity=".7"/>
    <text class="note" x="480" y="585" text-anchor="middle" font-weight="700" letter-spacing=".12em">SMALLEST CORRECT DESIGN</text>
    <rect x="200" y="598" width="270" height="48" rx="6" fill="#232832" stroke="#333a46"/>
    <circle cx="224" cy="622" r="13" fill="#1b1f26" stroke="#f0b452"/>
    <g transform="translate(224,622)" fill="none" stroke="#f0b452" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-8,0H-2M-5,-3L-2,0L-5,3M8,0H2M5,-3L2,0L5,3"/></g>
    <text x="246" y="618" font-size="10.5" fill="#d0d5dd">The PR grew past its plan</text>
    <text x="246" y="634" font-size="12" font-weight="700" fill="#e7e9ee">Opus trims what nobody asked for</text>
    <rect x="490" y="598" width="270" height="48" rx="6" fill="#232832" stroke="#333a46"/>
    <circle cx="514" cy="622" r="13" fill="#1b1f26" stroke="#f0b452"/>
    <g transform="translate(514,622)" fill="none" stroke="#f0b452" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-4,-4L4,4M4,-4L-4,4"/></g>
    <text x="536" y="618" font-size="10.5" fill="#d0d5dd">A review flags code nobody asked for</text>
    <text x="536" y="634" font-size="12" font-weight="700" fill="#e7e9ee">Delete it instead of fixing it</text>
    <rect x="200" y="666" width="270" height="48" rx="6" fill="#232832" stroke="#333a46"/>
    <circle cx="224" cy="690" r="13" fill="#1b1f26" stroke="#f0b452"/>
    <g transform="translate(224,690)" fill="none" stroke="#f0b452" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5,-2.5A6,6 0 1 0 6,2"/><path d="M6,-6.5V-2H1.5"/></g>
    <text x="246" y="686" font-size="10.5" fill="#d0d5dd">A serious finding shows the design is wrong</text>
    <text x="246" y="702" font-size="12" font-weight="700" fill="#e7e9ee">Both models plan again</text>
    <rect x="490" y="666" width="270" height="48" rx="6" fill="#232832" stroke="#333a46"/>
    <circle cx="514" cy="690" r="13" fill="#1b1f26" stroke="#f0b452"/>
    <g transform="translate(514,690)" fill="none" stroke="#f0b452" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-6,-5H6L1.5,0.5V5.5L-1.5,4V0.5Z"/></g>
    <text x="536" y="686" font-size="10.5" fill="#d0d5dd">A third plan still won’t settle</text>
    <text x="536" y="702" font-size="12" font-weight="700" fill="#e7e9ee">Opus cuts to the smallest useful PR</text>
    <path class="flow" d="M480,734V774"/>
    <text class="edge" x="488" y="758">review cap (min 2 rounds)</text>

    <rect class="box-claude" x="30" y="774" width="260" height="54" rx="8"/>
    <text class="h" x="160" y="797">Before each push</text>
    <text class="i" x="160" y="815">Sonnet trims tests, Opus writes the body</text>
    <rect class="box" x="350" y="774" width="260" height="54" rx="8"/>
    <text class="h" x="480" y="797">Push a draft PR</text>
    <text class="i" x="480" y="815">link it everywhere it belongs</text>
    <path class="flow" d="M290,801H350"/>
    <path class="flow" d="M480,828V854"/>

    <rect class="box" x="350" y="854" width="260" height="54" rx="8"/>
    <text class="h" x="480" y="877">Converge</text>
    <text class="i" x="480" y="895">watch CI and triage bot feedback on each push</text>
    <path class="fail" d="M610,881H942V407H930"/>
    <text class="failt" x="790" y="859" text-anchor="middle">CI failure, bot finding, maintainer feedback,</text>
    <text class="failt" x="790" y="872" text-anchor="middle">or a final review finding</text>
    <path class="flow" d="M480,908V938"/>
    <text class="edge" x="488" y="927">CI and bots pass</text>

    <rect class="box-ready" x="350" y="938" width="260" height="54" rx="8"/>
    <text class="h" x="480" y="961">Ready</text>
    <text class="i" x="480" y="979">fresh eyes review it as a maintainer would</text>
  </svg>

